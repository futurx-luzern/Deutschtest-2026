<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Testplattform – Login</title>
  <link rel="stylesheet" href="css/tailwind.min.css" />
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
  <main class="max-w-xl w-full bg-white rounded-xl shadow-lg p-8">
    <h1 class="text-2xl font-bold text-gray-800 mb-2">Testplattform</h1>
    <p class="text-gray-600 mb-6">Login für Teilnehmende und Admin.</p>

    <form id="login-form" class="space-y-4">
      <div>
        <label class="block text-sm font-medium mb-1" for="username">Benutzername</label>
        <input id="username" class="w-full border rounded-lg px-3 py-2" required />
      </div>
      <div>
        <label class="block text-sm font-medium mb-1" for="password">Passwort / PIN</label>
        <input id="password" type="password" class="w-full border rounded-lg px-3 py-2" required />
      </div>
      <button class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded-lg font-medium" type="submit">Einloggen</button>
    </form>

    <p id="msg" class="mt-4 text-sm"></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script>
    const msg = document.getElementById('msg');
    const cfg = window.APP_CONFIG || {};
    const supabase = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);

    function setMsg(text, err = false) {
      msg.textContent = text;
      msg.className = `mt-4 text-sm ${err ? 'text-red-600' : 'text-green-700'}`;
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      setMsg('Login wird geprüft...');

      const { data, error } = await supabase.rpc('app_login', { p_username: username, p_pin: password });
      if (error || !data || !data.ok) {
        setMsg(error?.message || data?.message || 'Login fehlgeschlagen.', true);
        return;
      }

      localStorage.setItem('app_session', JSON.stringify(data));
      if (data.role === 'admin') window.location.href = 'admin.html';
      else window.location.href = 'dashboard.html';
    });
  </script>
</body>
</html>
