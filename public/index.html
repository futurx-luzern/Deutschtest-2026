<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Testplattform – Teilnehmer-Login</title>
  <link rel="stylesheet" href="css/tailwind.min.css" />
  <style>
    body {
      background:
        radial-gradient(1200px 700px at -10% 0%, rgba(196, 181, 253, 0.45), transparent 60%),
        radial-gradient(1000px 650px at 100% 0%, rgba(147, 197, 253, 0.4), transparent 60%),
        linear-gradient(135deg, #eef2ff 0%, #e9d5ff 50%, #dbeafe 100%);
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.55);
      box-shadow: 0 18px 40px rgba(79, 70, 229, 0.16);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  <main class="max-w-xl w-full glass-card rounded-3xl p-8">
    <h1 class="text-2xl font-bold text-slate-900 mb-2">Einstufungstest</h1>
    <p class="text-slate-600 mb-6">Login für Teilnehmende.</p>

    <form id="login-form" class="space-y-4">
      <div>
        <label class="block text-sm font-medium mb-1 text-slate-700" for="username">Benutzername</label>
        <input id="username" class="w-full border border-white/60 rounded-xl px-3 py-2 bg-white/75 focus:outline-none focus:ring-2 focus:ring-indigo-300" required />
      </div>
      <div>
        <label class="block text-sm font-medium mb-1 text-slate-700" for="password">PIN</label>
        <input id="password" type="password" class="w-full border border-white/60 rounded-xl px-3 py-2 bg-white/75 focus:outline-none focus:ring-2 focus:ring-indigo-300" required />
      </div>
      <button class="w-full bg-gradient-to-r from-indigo-500 to-blue-500 hover:from-indigo-600 hover:to-blue-600 text-white py-2 rounded-xl font-medium shadow" type="submit">Einloggen</button>
    </form>

    <p id="msg" class="mt-4 text-sm"></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script>
    const msg = document.getElementById('msg');
    const cfg = window.APP_CONFIG || {};
    const supabase = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);

    function setMsg(text, err = false) {
      msg.textContent = text;
      msg.className = `mt-4 text-sm ${err ? 'text-red-600' : 'text-green-700'}`;
    }

    const existing = JSON.parse(localStorage.getItem('app_session') || 'null');
    if (existing?.role === 'participant' && existing?.session_token) {
      window.location.href = 'dashboard.html';
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      setMsg('Login wird geprüft...');

      const { data, error } = await supabase.rpc('app_login', { p_username: username, p_pin: password });
      if (error || !data || !data.ok) {
        setMsg(error?.message || data?.message || 'Login fehlgeschlagen.', true);
        return;
      }
      if (data.role !== 'participant') {
        setMsg('Bitte den separaten Admin-Login verwenden.', true);
        return;
      }

      localStorage.setItem('app_session', JSON.stringify(data));
      window.location.href = 'dashboard.html';
    });
  </script>
</body>
</html>
